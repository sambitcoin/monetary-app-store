releaseNotes: >-
  First alpha. Read "WHAT IT HAS NOT DONE" above before you install: the
  empty-disk mainnet install has never been run by anyone, including the
  author.


  This release adds a running disk watchdog. It stops Bitcoin Core at 20
  GiB free rather than letting the drive fill, deletes nothing, and
  restarts on its own when space comes back. It exists because the
  previous build filled a Raspberry Pi's disk and took the machine down
  with it — the startup space check had already approved that node, which
  is the point: checking once is not checking.


  Measured genesis to height 970,000 on a laptop: 970,001 blocks
  re-verified reading nothing but the filtered store, zero failures, and
  each record shown to extend the one before it. 36.6 GiB of carriers
  removed. 720.3 GiB of blocks became a 674.7 GiB store — a 6.33% saving,
  which is the honest figure and smaller than people expect. 91.79% of
  1.45 billion transactions are stored completely untouched.


  Four code reviews happened before this release and all four found real
  bugs. The ones that changed published figures:


  Contract witness data was being destroyed. The inscription detector
  matched the shape of an envelope — a push, then OP_IF, then data — which
  is also the shape of a Lightning HTLC. Those transactions lost their
  entire witness. 14.5 GiB counted as "spam removed" was contract
  signatures, about 28% of the published figure. Detection now requires
  the ordinals protocol tag, with regression tests built from real BOLT 3
  scripts.


  Oversized scriptSig was counted as removed and then copied into the
  store verbatim. A saving that never happened. It is now actually
  removed.


  The retention policy and the published policy identifier came from
  different code, so the identifier described rules that had never run.
  They are now one source, and a store records the policy that built it.


  Commitments were computed over the block hash a record claimed rather
  than the one recomputed from its header.
